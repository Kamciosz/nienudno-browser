<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NieNudno — nowa karta</title>
    <link rel="stylesheet" href="start.css">
    <script src="start.js" defer></script>
  </head>
  <body>
    <main>
      <img class="mark" src="mark.svg" alt="" width="80" height="80">
      <h1>NieNudno</h1>
      <form action="https://duckduckgo.com/" method="get" role="search">
        <label for="query" id="search-label">Wyszukaj w sieci</label>
        <div class="search-box">
          <input id="query" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="Wpisz, czego szukasz" autofocus required>
          <button type="submit" id="search-button">Szukaj</button>
        </div>
      </form>
    </main>
  </body>
</html>
